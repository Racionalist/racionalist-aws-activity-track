AWSTemplateFormatVersion: '2010-09-09'
Description: Grants Racionalist read-only monitoring access to this AWS account

Parameters:
  ExternalId:
    Type: String
    Description: Unique token provided by Racionalist. Do not change this value.
  AccountId:
    Type: String
    Description: Racionalist AWS Account ID. Do not change this value.
    Default: '7801-0210-6089'  # your actual account ID hardcoded here

Resources:
  MonitoringPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: RacionalistActivityPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BillingReadOnly
            Effect: Allow
            Action:
              - ce:GetCostAndUsage
              - ce:GetCostAndUsageWithResources
              - ce:GetCostForecast
              - ce:GetUsageForecast
              - ce:GetDimensionValues
              - ce:GetTags
              - ce:GetReservationCoverage
              - ce:GetReservationPurchaseRecommendation
              - ce:GetReservationUtilization
              - ce:GetSavingsPlansCoverage
              - ce:ListCostAllocationTags
              - budgets:ViewBudget
              - aws-portal:ViewBilling
              - aws-portal:ViewUsage
              - cur:DescribeReportDefinitions
              - pricing:GetProducts
              - pricing:DescribeServices
              - pricing:GetAttributeValues
            Resource: '*'
          - Sid: ResourceInventoryReadOnly
            Effect: Allow
            Action:
              - ec2:Describe*
              - elasticloadbalancing:Describe*
              - autoscaling:Describe*
              - s3:GetBucketLocation
              - s3:GetBucketTagging
              - s3:GetBucketVersioning
              - s3:ListAllMyBuckets
              - rds:Describe*
              - rds:ListTagsForResource
              - dynamodb:ListTables
              - dynamodb:DescribeTable
              - dynamodb:ListTagsOfResource
              - lambda:ListFunctions
              - lambda:GetFunction
              - lambda:ListTags
              - ecs:ListClusters
              - ecs:DescribeClusters
              - ecs:ListServices
              - ecs:DescribeServices
              - eks:ListClusters
              - eks:DescribeCluster
              - elasticache:DescribeCacheClusters
              - sqs:ListQueues
              - sqs:GetQueueAttributes
              - sns:ListTopics
              - sns:GetTopicAttributes
              - cloudfront:ListDistributions
              - route53:ListHostedZones
              - apigateway:GET
              - tag:GetResources
              - tag:GetTagKeys
              - tag:GetTagValues
              - config:DescribeConfigurationRecorders
              - config:GetResourceConfigHistory
              - config:ListDiscoveredResources
            Resource: '*'
          - Sid: UsageAndMetricsReadOnly
            Effect: Allow
            Action:
              - cloudwatch:GetMetricData
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
              - cloudwatch:DescribeAlarms
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
              - logs:GetLogGroupFields
              - logs:DescribeMetricFilters
              - servicequotas:GetServiceQuota
              - servicequotas:ListServiceQuotas
              - servicequotas:ListServices
              - health:DescribeEvents
              - health:DescribeEventDetails
              - health:DescribeAffectedEntities
            Resource: '*'

  MonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: RacionalistActivityRole_ec2
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - !Ref MonitoringPRacionalistActivityRole_ec2olicy

Outputs:
  RoleArn:
    Description: The ARN of the monitoring role - copy this back to Racionalist
    Value: !GetAtt MonitoringRole.Arn